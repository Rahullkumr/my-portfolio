# Render's free web services sleep after 15 minutes without traffic, and the
# next visitor waits 30-60 seconds for a cold start. Pinging the site every
# 5 minutes keeps it awake. GitHub can delay scheduled runs by several
# minutes, so the 5-minute interval leaves margin inside Render's 15.
#
# Set the repository variable SITE_URL (Settings > Secrets and variables >
# Actions > Variables) to change which URL is pinged.

name: Keep site awake

on:
  schedule:
    # Offset from :00, when GitHub's scheduler is busiest and drops runs
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://rahul-portfolio-2x6w.onrender.com' }}
        # A cold start can take up to a minute, so allow a long timeout
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --output /dev/null "$SITE_URL"
